name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Without a custom domain the site lives at https://<owner>.github.io/<repo>/.
      # Once a domain is attached (public/CNAME), the base path becomes "/".
      - name: Set base path
        run: |
          if [ -f public/CNAME ]; then echo "BASE_PATH=/" >> $GITHUB_ENV; else echo "BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV; fi
      - run: npm run build
      # Bakes the rendered HTML into dist/index.html for SEO (Chrome is preinstalled on ubuntu-latest).
      - run: npm run prerender
      # GitHub Pages serves 404.html for unknown paths; reuse the app so the router can show NotFound.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
